<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dynatrace + AI Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Dynatrace <span class="muted">+</span> AI</span>
    </div>
    <nav class="actions">
      <button id="btn-refresh" class="btn">Refresh</button>
      <button id="btn-analyze-all" class="btn primary" title="Analyze current problem list with AI">Analyze all (open)</button>
      <button id="btn-open-tester" class="btn" title="API tester for all endpoints">🧪 Tester</button>
      <label class="model-picker">
        Model
        <select id="model-select"></select>
      </label>
    </nav>
  </header>

  <section class="health" id="health"></section>

  <section class="filters">
    <label>
      Status
      <select id="filter-status">
        <option value="">All</option>
        <option value="OPEN" selected>OPEN</option>
        <option value="CLOSED">CLOSED</option>
      </select>
    </label>
    <label>
      Severity
      <select id="filter-severity">
        <option value="">Any</option>
        <option value="AVAILABILITY">AVAILABILITY</option>
        <option value="ERROR">ERROR</option>
        <option value="PERFORMANCE">PERFORMANCE</option>
        <option value="RESOURCE_CONTENTION">RESOURCE_CONTENTION</option>
        <option value="MONITORING_UNAVAILABLE">MONITORING_UNAVAILABLE</option>
        <option value="CUSTOM_ALERT">CUSTOM_ALERT</option>
        <option value="INFORMATION">INFORMATION</option>
      </select>
    </label>
    <label>
      Page size
      <select id="filter-pagesize">
        <option>10</option>
        <option selected>20</option>
        <option>50</option>
        <option>100</option>
      </select>
    </label>
  </section>

  <section class="summary" id="summary"></section>

  <main>
    <table class="problems" id="problems-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Severity</th>
          <th>Status</th>
          <th>Affected</th>
          <th>Started</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="problems-tbody">
        <tr><td colspan="7" class="empty">Loading&hellip;</td></tr>
      </tbody>
    </table>
  </main>

  <!-- Analysis modal -->
  <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <header>
        <h2 id="modal-title">AI Analysis</h2>
        <button class="close" id="modal-close" aria-label="Close">&times;</button>
      </header>
      <div class="modal-body" id="modal-body">Loading&hellip;</div>
      <footer class="modal-footer" id="modal-footer">
        <button class="btn" id="btn-ask-ai" data-default-label="🤖 Ask AI about this">🤖 Ask AI about this</button>
      </footer>
    </div>
  </div>

  <!-- Chat panel -->
  <button class="chat-fab hidden" id="chat-fab" aria-label="Open chat" type="button">
    <span aria-hidden="true">💬</span>
    <span class="chat-badge hidden" id="chat-badge"></span>
  </button>

  <aside class="chat-panel hidden" id="chat-panel" role="dialog" aria-label="AI chat">
    <header class="chat-header">
      <div class="chat-title">
        <span class="dot"></span>
        <span>AI Assistant</span>
        <span class="chat-context muted" id="chat-context"></span>
      </div>
      <div class="chat-actions">
        <button class="btn small" id="chat-clear" title="Clear conversation">Clear</button>
        <button class="btn small" id="chat-close" aria-label="Close chat">&times;</button>
      </div>
    </header>
    <div class="chat-log" id="chat-log">
      <div class="chat-empty muted">Ask anything about Dynatrace problems or paste a problem from the table to discuss it.</div>
    </div>
    <form class="chat-input" id="chat-form" autocomplete="off">
      <textarea id="chat-text" placeholder="Type a message&hellip; (Shift+Enter for newline, Enter to send)" rows="1"></textarea>
      <button class="btn primary" id="chat-send" type="submit">Send</button>
    </form>
  </aside>

  <!-- API Tester panel (slide-out from right) -->
  <aside class="tester-panel hidden" id="tester-panel" role="dialog" aria-label="API tester">
    <header class="tester-header">
      <div class="tester-title">
        <span class="dot"></span>
        <span>API Tester</span>
        <span class="muted small">live request runner</span>
      </div>
      <div class="tester-actions">
        <button class="btn small" id="tester-run-all" title="Run every endpoint once">▶ Run all</button>
        <button class="btn small" id="tester-clear-history" title="Clear response history">Clear</button>
        <button class="btn small" id="tester-close" aria-label="Close tester">&times;</button>
      </div>
    </header>

    <div class="tester-body">
      <!-- Endpoint picker -->
      <div class="tester-row">
        <label>Endpoint</label>
        <select id="tester-endpoint" class="tester-input"></select>
      </div>

      <!-- Method + path preview -->
      <div class="tester-row">
        <label>Method / Path</label>
        <div class="tester-method-row">
          <span id="tester-method" class="badge method">GET</span>
          <code id="tester-path-preview" class="tester-path">/api/health</code>
          <span id="tester-rate-limit" class="muted small"></span>
        </div>
      </div>

      <!-- Description (read-only) -->
      <div class="tester-row">
        <small id="tester-description" class="muted">Pick an endpoint above.</small>
      </div>

      <!-- Query parameters (for endpoints that take them) -->
      <div class="tester-row" id="tester-query-row">
        <label>
          Query parameters
          <button class="btn small" id="tester-add-query" type="button">+ add</button>
        </label>
        <div id="tester-query-list" class="tester-kv-list"></div>
      </div>

      <!-- Request body -->
      <div class="tester-row" id="tester-body-row">
        <label>
          Request body (JSON)
          <button class="btn small" id="tester-format-body" type="button" title="Pretty-print">format</button>
          <button class="btn small" id="tester-reset-body" type="button" title="Reset to sample">reset</button>
        </label>
        <textarea id="tester-body" class="tester-textarea" rows="8" spellcheck="false"></textarea>
        <small id="tester-body-status" class="muted"></small>
      </div>

      <!-- Path param hint -->
      <div class="tester-row" id="tester-path-row">
        <label>
          Path parameters
          <button class="btn small" id="tester-fill-from-row" type="button" title="Use selected problem id from the table">use selected row</button>
        </label>
        <div id="tester-path-list" class="tester-kv-list"></div>
      </div>

      <!-- Send -->
      <div class="tester-row tester-send-row">
        <button class="btn primary" id="tester-send">Send request</button>
        <label class="tester-options">
          <input type="checkbox" id="tester-stream" />
          <span>Stream (SSE — when applicable)</span>
        </label>
      </div>

      <!-- Last response -->
      <div class="tester-row">
        <label>Response</label>
        <div id="tester-response" class="tester-response">
          <div class="muted">Click <b>Send request</b> to run.</div>
        </div>
      </div>

      <!-- History -->
      <div class="tester-row">
        <label>History <span class="muted small">(newest first)</span></label>
        <div id="tester-history" class="tester-history"></div>
      </div>
    </div>
  </aside>

  <script src="/tester.js" type="module"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
